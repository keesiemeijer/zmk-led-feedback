name: Configuration validation

on:
  push:
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  config-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Configure tests
        run: cmake -S tests/config-validation -B build/config-validation
      - name: Run tests
        run: ctest --test-dir build/config-validation --output-on-failure
      - name: Configure and build startup diagnostic tests
        run: |
          cmake -S tests/startup-diagnostic -B build/startup-diagnostic
          cmake --build build/startup-diagnostic
      - name: Run startup diagnostic tests
        run: ctest --test-dir build/startup-diagnostic --output-on-failure
