name: Firmware build matrix

on:
    push:
        paths-ignore:
            - "**.md"
    pull_request:
        paths-ignore:
            - "**.md"
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        container:
            image: zmkfirmware/zmk-build-arm:stable
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: feedback-on
                      cmake-args: -DCONFIG_ZMK_DISPLAY=n
                      required_config: CONFIG_ZMK_LED_FEEDBACK_REQUIRED_PERIPHERALS=-1
                      diagnostic_config: '# CONFIG_ZMK_LED_FEEDBACK_STARTUP_DIAGNOSTIC is not set'
                    - name: diagnostic-connection
                      cmake-args: >-
                          -DCONFIG_ZMK_DISPLAY=n
                          -DCONFIG_ZMK_LED_FEEDBACK_STARTUP_DIAGNOSTIC=y
                      diagnostic_config: CONFIG_ZMK_LED_FEEDBACK_STARTUP_DIAGNOSTIC=y
                    - name: diagnostic-battery-only
                      cmake-args: >-
                          -DCONFIG_ZMK_DISPLAY=n
                          -DCONFIG_ZMK_LED_FEEDBACK_CONNECTION=n
                          -DCONFIG_ZMK_LED_FEEDBACK_BATTERY=y
                          -DCONFIG_ZMK_LED_FEEDBACK_STARTUP_DIAGNOSTIC=y
                      diagnostic_config: CONFIG_ZMK_LED_FEEDBACK_STARTUP_DIAGNOSTIC=y
                    - name: diagnostic-combined-no-layer
                      cmake-args: >-
                          -DCONFIG_ZMK_DISPLAY=n
                          -DCONFIG_ZMK_LED_FEEDBACK_LAYER=n
                          -DCONFIG_ZMK_LED_FEEDBACK_CONNECTION=y
                          -DCONFIG_ZMK_LED_FEEDBACK_BATTERY=y
                          -DCONFIG_ZMK_LED_FEEDBACK_BATTERY_WARNING_LEVEL=15
                          -DCONFIG_ZMK_LED_FEEDBACK_STARTUP_DIAGNOSTIC=y
                      diagnostic_config: CONFIG_ZMK_LED_FEEDBACK_STARTUP_DIAGNOSTIC=y
                    - name: connection-zero-required
                      cmake-args: >-
                          -DCONFIG_ZMK_DISPLAY=n
                          -DCONFIG_ZMK_LED_FEEDBACK_BATTERY=n
                          -DCONFIG_ZMK_LED_FEEDBACK_REQUIRED_PERIPHERALS=0
                      required_config: CONFIG_ZMK_LED_FEEDBACK_REQUIRED_PERIPHERALS=0
                    - name: connection-reordered-required
                      cmake-args: >-
                          -DCONFIG_ZMK_DISPLAY=n
                          -DCONFIG_ZMK_LED_FEEDBACK_BATTERY=n
                          -DCONFIG_ZMK_LED_FEEDBACK_REQUIRED_PERIPHERALS=1
                          -DCONFIG_ZMK_LED_FEEDBACK_SLOT_ORDER=\"2,1\"
                      required_config: CONFIG_ZMK_LED_FEEDBACK_REQUIRED_PERIPHERALS=1
                      slot_config: 'CONFIG_ZMK_LED_FEEDBACK_SLOT_ORDER="2,1"'
                    - name: battery-only-required
                      cmake-args: >-
                          -DCONFIG_ZMK_DISPLAY=n
                          -DCONFIG_ZMK_LED_FEEDBACK_CONNECTION=n
                          -DCONFIG_ZMK_LED_FEEDBACK_BATTERY=y
                          -DCONFIG_ZMK_LED_FEEDBACK_REQUIRED_PERIPHERALS=1
                      required_config: CONFIG_ZMK_LED_FEEDBACK_REQUIRED_PERIPHERALS=1
                    - name: feedback-off-no-overrides
                      cmake-args: -DCONFIG_ZMK_DISPLAY=n -DCONFIG_ZMK_LED_FEEDBACK_DISPLAY_OFF=y
                    - name: feedback-off-all-overrides
                      cmake-args: >-
                          -DCONFIG_ZMK_DISPLAY=n
                          -DCONFIG_ZMK_LED_FEEDBACK_DISPLAY_OFF=y
                          -DCONFIG_ZMK_LED_FEEDBACK_OFF_OVERRIDES=\"layer_feedback,layer_change,battery_feedback,battery_warning,connection_warning\"
                          -DCONFIG_ZMK_LED_FEEDBACK_BATTERY=y
                          -DCONFIG_ZMK_LED_FEEDBACK_BATTERY_WARNING_LEVEL=15
        name: Build (${{ matrix.name }})
        steps:
            - uses: actions/checkout@v7.0.1
            - name: Prepare west workspace
              run: |
                  mkdir -p "$RUNNER_TEMP/zmk-workspace/config"
                  cp -R "$GITHUB_WORKSPACE/tests/firmware-build/config/." "$RUNNER_TEMP/zmk-workspace/config/"
            - name: Initialize west workspace
              working-directory: ${{ runner.temp }}/zmk-workspace
              run: |
                  west init -l config
                  west update --fetch-opt=--filter=tree:0
                  west zephyr-export
            - name: Build test dongle
              working-directory: ${{ runner.temp }}/zmk-workspace
              run: |
                  west build -s zmk/app -d build -b nice_nano_v2 -- \
                    -DZMK_CONFIG="$RUNNER_TEMP/zmk-workspace/config" \
                    -DZMK_EXTRA_MODULES="$GITHUB_WORKSPACE" \
                    -DSHIELD=lf_test_dongle \
                    ${{ matrix.cmake-args }}
            - name: Verify required-peripheral configuration
              if: ${{ matrix.required_config != '' }}
              working-directory: ${{ runner.temp }}/zmk-workspace
              run: grep -Fx '${{ matrix.required_config }}' build/zephyr/.config
            - name: Verify slot order configuration
              if: ${{ matrix.slot_config != '' }}
              working-directory: ${{ runner.temp }}/zmk-workspace
              run: grep -Fx '${{ matrix.slot_config }}' build/zephyr/.config
            - name: Verify diagnostic configuration
              if: ${{ matrix.diagnostic_config != '' }}
              working-directory: ${{ runner.temp }}/zmk-workspace
              run: grep -Fx '${{ matrix.diagnostic_config }}' build/zephyr/.config
