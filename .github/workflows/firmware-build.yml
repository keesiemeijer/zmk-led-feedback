name: Firmware build matrix

on:
    push:
        paths-ignore:
            - "**.md"
    pull_request:
        paths-ignore:
            - "**.md"
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        container:
            image: zmkfirmware/zmk-build-arm:stable
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: warnings-off
                      cmake-args: -DCONFIG_ZMK_DISPLAY=n
                    - name: connection-only
                      cmake-args: -DCONFIG_ZMK_DISPLAY=n -DCONFIG_ZMK_LED_FEEDBACK_CONNECTION=y
                    - name: battery-only
                      cmake-args: >-
                          -DCONFIG_ZMK_DISPLAY=n
                          -DCONFIG_ZMK_LED_FEEDBACK_BATTERY=y
                          -DCONFIG_ZMK_LED_FEEDBACK_BATTERY_WARNING_LEVEL=15
                    - name: both-warnings
                      cmake-args: >-
                          -DCONFIG_ZMK_DISPLAY=n
                          -DCONFIG_ZMK_LED_FEEDBACK_CONNECTION=y
                          -DCONFIG_ZMK_LED_FEEDBACK_BATTERY=y
                          -DCONFIG_ZMK_LED_FEEDBACK_BATTERY_WARNING_LEVEL=15
        name: Build (${{ matrix.name }})
        steps:
            - uses: actions/checkout@v7.0.1
            - name: Prepare west workspace
              run: |
                  mkdir -p "$RUNNER_TEMP/zmk-workspace/config"
                  cp -R "$GITHUB_WORKSPACE/tests/firmware-build/config/." "$RUNNER_TEMP/zmk-workspace/config/"
            - name: Initialize west workspace
              working-directory: ${{ runner.temp }}/zmk-workspace
              run: |
                  west init -l config
                  west update --fetch-opt=--filter=tree:0
                  west zephyr-export
            - name: Build test dongle
              working-directory: ${{ runner.temp }}/zmk-workspace
              run: |
                  west build -s zmk/app -d build -b nice_nano_v2 -- \
                    -DZMK_CONFIG="$RUNNER_TEMP/zmk-workspace/config" \
                    -DZMK_EXTRA_MODULES="$GITHUB_WORKSPACE" \
                    -DSHIELD=lf_test_dongle \
                    ${{ matrix.cmake-args }}
            - name: Validate real ZMK configuration boundaries
              if: matrix.name == 'warnings-off'
              env:
                  ZMK_WORKSPACE: ${{ runner.temp }}/zmk-workspace
                  MODULE_SOURCE_DIR: ${{ github.workspace }}
                  ZMK_CONFIG_DIR: ${{ runner.temp }}/zmk-workspace/config
                  VALIDATION_BUILD_ROOT: ${{ runner.temp }}/led-feedback-config-validation
              run: sh "$GITHUB_WORKSPACE/tests/firmware-build/validate_config.sh"
