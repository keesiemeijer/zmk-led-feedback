name: Firmware build matrix

on:
    push:
        paths-ignore:
            - "**.md"
    pull_request:
        paths-ignore:
            - "**.md"
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        container:
            image: zmkfirmware/zmk-build-arm:stable
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: warnings-off
                      cmake-args: -DCONFIG_ZMK_DISPLAY=n
                      connection: n
                      battery: n
                      threshold: unset
                      required: -1
                      layer: y
                    - name: connection-only
                      cmake-args: -DCONFIG_ZMK_DISPLAY=n -DCONFIG_ZMK_LED_FEEDBACK_CONNECTION=y
                      connection: y
                      battery: n
                      threshold: unset
                      required: -1
                      layer: y
                    - name: battery-monitoring-only
                      cmake-args: >-
                          -DCONFIG_ZMK_DISPLAY=n
                          -DCONFIG_ZMK_LED_FEEDBACK_BATTERY=y
                          -DCONFIG_ZMK_LED_FEEDBACK_BATTERY_WARNING_LEVEL=0
                      connection: n
                      battery: y
                      threshold: 0
                      required: -1
                      layer: y
                    - name: battery-only
                      cmake-args: >-
                          -DCONFIG_ZMK_DISPLAY=n
                          -DCONFIG_ZMK_LED_FEEDBACK_BATTERY=y
                          -DCONFIG_ZMK_LED_FEEDBACK_BATTERY_WARNING_LEVEL=15
                          -DCONFIG_ZMK_LED_FEEDBACK_REQUIRED_PERIPHERALS=1
                      connection: n
                      battery: y
                      threshold: 15
                      required: 1
                      layer: y
                    - name: both-warnings
                      cmake-args: >-
                          -DCONFIG_ZMK_DISPLAY=n
                          -DCONFIG_ZMK_LED_FEEDBACK_CONNECTION=y
                          -DCONFIG_ZMK_LED_FEEDBACK_BATTERY=y
                          -DCONFIG_ZMK_LED_FEEDBACK_BATTERY_WARNING_LEVEL=15
                      connection: y
                      battery: y
                      threshold: 15
                      required: -1
                      layer: y
                    - name: battery-only-layer-disabled
                      cmake-args: >-
                          -DCONFIG_ZMK_DISPLAY=n
                          -DCONFIG_ZMK_LED_FEEDBACK_LAYER=n
                          -DCONFIG_ZMK_LED_FEEDBACK_BATTERY=y
                          -DCONFIG_ZMK_LED_FEEDBACK_BATTERY_WARNING_LEVEL=15
                      connection: n
                      battery: y
                      threshold: 15
                      required: -1
                      layer: n
                    - name: short-strip-three-slots
                      shield: lf_test_dongle_short_strip
                      cmake-args: >-
                          -DCONFIG_ZMK_DISPLAY=n
                          -DCONFIG_ZMK_LED_FEEDBACK_CONNECTION=y
                      connection: y
                      battery: n
                      threshold: unset
                      required: -1
                      layer: y
        name: Build (${{ matrix.name }})
        steps:
            - uses: actions/checkout@v7.0.1
            - name: Prepare west workspace
              run: |
                  mkdir -p "$RUNNER_TEMP/zmk-workspace/config"
                  cp -R "$GITHUB_WORKSPACE/tests/firmware-build/config/." "$RUNNER_TEMP/zmk-workspace/config/"
            - name: Initialize west workspace
              working-directory: ${{ runner.temp }}/zmk-workspace
              run: |
                  west init -l config
                  west update --fetch-opt=--filter=tree:0
                  west zephyr-export
            - name: Build test dongle
              working-directory: ${{ runner.temp }}/zmk-workspace
              run: |
                  west build -s zmk/app -d build -b nice_nano_v2 -- \
                    -DZMK_CONFIG="$RUNNER_TEMP/zmk-workspace/config" \
                    -DZMK_EXTRA_MODULES="$GITHUB_WORKSPACE" \
                    -DSHIELD=${{ matrix.shield || 'lf_test_dongle' }} \
                    ${{ matrix.cmake-args }}
            - name: Verify effective configuration
              working-directory: ${{ runner.temp }}/zmk-workspace
              run: |
                  config=build/zephyr/.config
                  if [ "${{ matrix.connection }}" = y ]; then
                    grep -qx 'CONFIG_ZMK_LED_FEEDBACK_CONNECTION=y' "$config"
                  else
                    grep -qx '# CONFIG_ZMK_LED_FEEDBACK_CONNECTION is not set' "$config"
                  fi
                  if [ "${{ matrix.battery }}" = y ]; then
                    grep -qx 'CONFIG_ZMK_LED_FEEDBACK_BATTERY=y' "$config"
                    grep -qx 'CONFIG_ZMK_LED_FEEDBACK_BATTERY_WARNING_LEVEL=${{ matrix.threshold }}' "$config"
                  else
                    grep -qx '# CONFIG_ZMK_LED_FEEDBACK_BATTERY is not set' "$config"
                  fi
                  grep -qx 'CONFIG_ZMK_LED_FEEDBACK_REQUIRED_PERIPHERALS=${{ matrix.required }}' "$config"
                  if [ "${{ matrix.layer }}" = y ]; then
                    grep -qx 'CONFIG_ZMK_LED_FEEDBACK_LAYER=y' "$config"
                  else
                    grep -qx '# CONFIG_ZMK_LED_FEEDBACK_LAYER is not set' "$config"
                  fi
                  if [ "${{ matrix.name }}" = short-strip-three-slots ]; then
                    grep -qx 'CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=3' "$config"
                    grep -Eq 'chain-length = <[[:space:]]*(0x0*1|1)[[:space:]]*>;' build/zephyr/zephyr.dts
                  fi
            - name: Validate real ZMK configuration boundaries
              if: matrix.name == 'warnings-off'
              env:
                  ZMK_WORKSPACE: ${{ runner.temp }}/zmk-workspace
                  MODULE_SOURCE_DIR: ${{ github.workspace }}
                  ZMK_CONFIG_DIR: ${{ runner.temp }}/zmk-workspace/config
                  VALIDATION_BUILD_ROOT: ${{ runner.temp }}/led-feedback-config-validation
              run: sh "$GITHUB_WORKSPACE/tests/firmware-build/validate_config.sh"
